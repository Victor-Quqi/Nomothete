<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Pick the light before the first paint. Same key and rule as web/theme.ts.
      try {
        var theme = localStorage.getItem('nomothete.theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="color-scheme"]').content = theme
      } catch (e) {}
    </script>
    <title>Nomothete · 立名者</title>
    <meta name="description" content="自托管的软件项目命名工具。描述项目，得到候选名；每个名字带着取义，并已查过能不能注册、会不会搜不到。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090C'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23D9A441' text-anchor='middle'%3E%CE%BD%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
